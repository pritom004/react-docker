name: CI
on: 
    push:
        branches: 
            - master
    pull_request: 
        branches:
            - master
jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
            - name: Build Docker Image
              run: docker build -t pritom06/docker-react -f Dockerfile.dev .
            - name: Run tests
              run: docker run pritom06/docker-react npm run test:ci
    deploy:
      name: Deploy to Elastic Beanstalk
      runs-on: ubuntu-latest
      needs: test
      steps:
        - name: Checkout repository
          uses: actions/checkout@v7
        - name: Generate deployment package
          run: zip -r deploy.zip . -x ".git/*" ".github/*" "node_modules/*"
        - name: Deploy to Elastic Beanstalk
          uses: einaregilsson/beanstalk-deploy@v22
          with:
            aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
            aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            application_name: docker-react
            environment_name: Docker-react-env
            version_label: docker-react-${{github.sha}}
            region: us-east-1
            deployment_package: deploy.zip 
            wait_for_environment_recovery: 180
            
